#runc_version: "{{ lookup('url', 'https://api.github.com/repos/opencontainers/runc/releases/latest', headers={'Accept': 'application/vnd.github+json'}) | from_json | json_query('tag_name') | regex_replace('^v', '') | default('1.4.1') }}"
